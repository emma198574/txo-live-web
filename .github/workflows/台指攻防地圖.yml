name: 台指攻防地圖

# 每個交易日盤後把「下一個交易日的攻防地圖」推到 iPhone。
#
# 為什麼是 16:22（UTC 08:22）而不是整點：
#   資料面 16:00 之後就齊了——選擇權收盤 OI 檔約 15:00 出、三大法人 15:00–15:30、
#   夜盤 15:00 開盤，所以 16:22 抓到的都是定稿數字。
#   分鐘數刻意不用 0 或 5 的倍數：GitHub 的 schedule 只是「盡力而為」，
#   整點是全球排程最壅塞的時刻，高負載時會直接丟掉整次排程。
#   真的被跳過的話，到 Actions 頁面手動 Run 一次即可（預設會推播）。
#
# 非交易日不用特別擋：腳本抓不到當日選擇權收盤檔就自己結束、不推播、回傳碼 0。
on:
  schedule:
    - cron: '22 8 * * 1-5'
  workflow_dispatch:
    inputs:
      notify:
        description: '推播到 iPhone (ntfy)'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet requests tzdata

      - name: 產生攻防地圖並推播
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # 排程一律推播；手動 Run 時看勾選。--json 一起產出來，
          # 之後接敘事層（雲端 Claude 排程）要吃這份數字。
          FLAG="--notify"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.notify }}" != "true" ]; then
            FLAG="--dry-run"
          fi
          python3 "產生_台指攻防地圖.py" \
            --out /tmp/台指攻防地圖.html \
            --json /tmp/地圖.json \
            $FLAG

      - name: 留存產出（失敗時可下載回來看）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 攻防地圖
          path: |
            /tmp/台指攻防地圖.html
            /tmp/地圖.json
          if-no-files-found: ignore
          retention-days: 7
